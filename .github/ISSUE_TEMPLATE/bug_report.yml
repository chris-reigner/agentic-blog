name: "\U0001F41B Bug Report"
description: Report a defect so a contributor can reproduce and fix it.
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Please give a contributor enough to reproduce it.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact commands / config. A minimal repro is ideal.
      placeholder: |
        1. make run ARGS="run sample.pdf --topic demo --render blog"
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: dropdown
    id: python-version
    attributes:
      label: Python version
      options:
        - "3.10"
        - "3.11"
        - "3.12"
        - Other
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Silo / area
      options:
        - Ingest
        - Distill
        - Render
        - Memory
        - CLI
        - Pipeline
        - CI/CD
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / config
      description: Paste tracebacks or the relevant `config/config.yaml` snippet. Redact secrets.
      render: shell
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
    validations:
      required: false
