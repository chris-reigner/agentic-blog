site_name: agentic-blog
site_description: Distil a source of knowledge once, then render it many ways.
docs_dir: docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.top
    - content.code.copy
    - toc.follow

nav:
  - Home: index.md
  - Pipeline: PIPELINE.md
  - Ingest: INGEST.md
  - Distill: DISTILL.md
  - Render: RENDER.md
  - Memory: MEMORY.md

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
