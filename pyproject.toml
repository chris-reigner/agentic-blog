[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-blog"
version = "1.0.1"
description = "Distil a source of knowledge once, then render it many ways (markdown, blog, linkedin, agent skill)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.0",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=1.0",
    "openai>=1.0",
    "pypdf>=6.15.0",
    "pdfminer-six>=20260107",
]

[project.scripts]
agentic-blog = "agentic_blog.cli:app"

[project.optional-dependencies]
pdf = ["pymupdf4llm", "pypdf", "pdfminer.six"]
docx = ["python-docx"]
rtf = ["striprtf"]
html = ["beautifulsoup4", "markdownify"]
all = [
    "pymupdf4llm",
    "pypdf",
    "pdfminer.six",
    "beautifulsoup4",
    "markdownify",
    "python-docx",
    "striprtf",
    "mkdocs-material>=9.5",
]
docs = ["mkdocs-material>=9.5"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "yamllint>=1.35",
    "pre-commit>=3.8",
    "types-PyYAML",
    "python-semantic-release>=9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_blog"]

# ── Ruff ──────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W", "C4", "SIM"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
# Typer relies on function calls (typer.Option/Argument) in argument defaults.
"src/agentic_blog/cli.py" = ["B008"]

# ── Mypy ──────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
files = ["src/agentic_blog"]
# Optional third-party extractors have no stubs; don't fail on them.
[[tool.mypy.overrides]]
module = [
    "pypdf.*", "pdfminer.*", "bs4.*",
    "docx.*", "striprtf.*", "pymupdf.*", "pymupdf4llm.*",
]
ignore_missing_imports = true

# The code never types against numpy (it arrives via optional extractors), so
# skip its stubs rather than resolve them.
[[tool.mypy.overrides]]
module = ["numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# ── Semantic Release ──────────────────────────────────────────────────────────
# Version is bumped from Conventional-Commit history on `main` (squash-merged PR
# titles). See .github/workflows/release.yml.
[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
build_command = "uv build"
commit_message = "chore(release): v{version} [skip ci]"
tag_format = "v{version}"

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.commit_parser_options]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

[tool.semantic_release.changelog]
# GitHub Release notes come from .github/release.yml; no committed changelog file.
default_templates.changelog_file = "CHANGELOG.md"
exclude_commit_patterns = ["chore\\(release\\):"]
